name: Planning Decision Model
on:
  push:
    branches:
      - feature/planning-decision-model-shadow
  pull_request:
    paths:
      - 'src/planning_factory/adapters/decision_model.py'
      - 'src/planning_factory/adapters/dashboard_api.py'
      - 'src/planning_factory/adapters/secure_dashboard.py'
      - 'src/planning_factory/web/decision-model*'
      - 'src/planning_factory/web/index.html'
      - 'tests/test_decision_model.py'
      - '.github/workflows/planning-decision-model.yml'
jobs:
  decision-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_decision_model.py -t .
      - run: python -m compileall -q src/planning_factory/adapters/decision_model.py src/planning_factory/adapters/dashboard_api.py src/planning_factory/adapters/secure_dashboard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/planning_factory/web/decision-model.js

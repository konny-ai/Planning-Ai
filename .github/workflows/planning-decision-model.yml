name: Planning AI Decision Center
on:
  push:
    branches:
      - Planning_Ai_DecisionModel
      - feature/planning-decision-model-shadow
  pull_request:
    paths:
      - 'src/planning_factory/adapters/decision_*.py'
      - 'src/planning_factory/adapters/dashboard_api.py'
      - 'src/planning_factory/adapters/secure_dashboard.py'
      - 'src/planning_factory/web/decision-model*'
      - 'src/planning_factory/web/index.html'
      - 'tests/test_decision_*.py'
      - '.github/workflows/planning-decision-model.yml'
jobs:
  decision-center:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Compile changed modules
        run: |
          python -m compileall -q src/planning_factory/adapters/decision_model.py src/planning_factory/adapters/decision_center.py src/planning_factory/adapters/decision_history.py src/planning_factory/adapters/decision_workflow.py src/planning_factory/adapters/dashboard_api.py src/planning_factory/adapters/secure_dashboard.py
      - name: Decision Center contracts and HTTP integration
        run: python -m unittest -v tests.test_decision_model tests.test_decision_center tests.test_decision_center_http tests.test_decision_center_security tests.test_decision_model_transport tests.test_decision_center_edge
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser script syntax
        run: node --check src/planning_factory/web/decision-model.js
      - name: Full planning regression suite
        run: python -m unittest discover -s tests -t .

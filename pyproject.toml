[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-factory"
version = "0.2.0"
description = "Motore di pianificazione della produzione a capacità finita"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
planning-factory = "planning_factory.cli:main"

[tool.setuptools.package-data]
planning_factory = ["schemas/*.json", "web/*.html", "web/*.css", "web/*.js"]
